name: Build AerioTV for Fire OS 6 (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fireos6:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out AerioTV source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Patch minimum OS and desugar Java APIs for Android 7.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          substitutions = [
              ('minSdk = 26', 'minSdk = 25'),
              ('    compileOptions {\n',
               '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n'),
              ('dependencies {\n',
               'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'),
          ]
          for old, new in substitutions:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Unexpected source layout: expected one {old!r}, found {count}. Stop rather than patching wrong code.')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          print('Patched minSdk=25, core-library desugaring enabled, added desugar_jdk_libs.')
          PY

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (no in-app updates)
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assemblePlayDebug --no-daemon --stacktrace --console=plain 2>&1 | tee fireos6-build.log

      - name: Verify APK is compatible with API 25 at manifest level
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/play/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk" || { echo 'No APK found'; exit 1; }
          echo "APK: $apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee fireos6-apk-info.txt
          "$aapt" dump badging "$apk" | grep -q "sdkVersion:'25'" || { echo 'APK did not report API 25 as minimum'; exit 1; }

      - name: Upload Fire OS 6 APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-FireOS6-API25-UNTESTED
          path: |
            app/build/outputs/apk/play/debug/*.apk
            fireos6-apk-info.txt
          if-no-files-found: error

      - name: Upload build log if a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-FireOS6-Build-Log
          path: fireos6-build.log
          if-no-files-found: ignore

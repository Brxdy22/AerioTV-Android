name: AerioTV Fire OS 6 - Build upstream updates

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'What to build: "release" = latest official release tag, "main" = upstream main branch (unreleased, dev)'
        type: choice
        options:
          - release
          - main
        default: main
      rebuild:
        description: 'Rebuild even if a build for this commit/release already exists (replaces that release)'
        type: boolean
        default: false
  schedule:
    # Daily at 09:41 UTC (GitHub may delay scheduled jobs). Scheduled runs build
    # "main"; a run with no new upstream commit exits early without building.
    - cron: '41 9 * * *'

permissions:
  contents: write  # Required only to publish your custom APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve what to build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs have no inputs, so they fall back to "main".
          CHANNEL: ${{ inputs.channel || 'main' }}
          REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          upstream=jonzey231/AerioTV-Android
          case "$CHANNEL" in
            release)
              upstream_ref=$(gh api "repos/$upstream/releases/latest" --jq '.tag_name')
              if [[ ! "$upstream_ref" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
                echo "Unexpected upstream release tag: $upstream_ref" >&2
                exit 1
              fi
              local_tag="fireos6-${upstream_ref}"
              label="$upstream_ref"
              version_suffix=""
              ;;
            main)
              # Pin the exact commit so the checkout matches what we tag.
              upstream_ref=$(gh api "repos/$upstream/commits/main" --jq '.sha')
              if [[ ! "$upstream_ref" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Unexpected upstream main SHA: $upstream_ref" >&2
                exit 1
              fi
              short=${upstream_ref:0:7}
              local_tag="fireos6-main-${short}"
              label="main@${short}"
              version_suffix="-main.${short}"
              ;;
            *)
              echo "Unknown channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          {
            echo "channel=$CHANNEL"
            echo "upstream_ref=$upstream_ref"
            echo "local_tag=$local_tag"
            echo "label=$label"
            echo "version_suffix=$version_suffix"
          } >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" = true ]; then
            echo "already_built=false" >> "$GITHUB_OUTPUT"
            echo "Rebuild requested for $label; an existing $local_tag release will be replaced after a successful build."
          elif gh release view "$local_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
            echo "The custom Fire OS 6 build for $label already exists ($local_tag). Nothing to do."
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
            echo "Will build Fire OS 6 APK for $label."
          fi

      - name: Check out upstream source
        if: steps.version.outputs.already_built == 'false'
        uses: actions/checkout@v4
        with:
          repository: jonzey231/AerioTV-Android
          ref: ${{ steps.version.outputs.upstream_ref }}
          path: upstream
          persist-credentials: false

      - name: Set up Java 21
        if: steps.version.outputs.already_built == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.version.outputs.already_built == 'false'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        if: steps.version.outputs.already_built == 'false'
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Restore permanent debug signing key from Actions secret
        if: steps.version.outputs.already_built == 'false'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.FIREOS6_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo 'Missing repository secret FIREOS6_DEBUG_KEYSTORE_B64. See README.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo 'Restored the same signing certificate for this and subsequent builds.'

      - name: Patch Android 7.1 compatibility and update version code
        if: steps.version.outputs.already_built == 'false'
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from pathlib import Path

          path = Path('upstream/app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          substitutions = [
              ('minSdk = 26', 'minSdk = 25'),
              ('    compileOptions {\n',
               '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n'),
              ('dependencies {\n',
               'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'),
          ]
          for old, new in substitutions:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Upstream Gradle layout changed: expected exactly one {old!r}, found {count}. Review instead of guessing.')
              source = source.replace(old, new, 1)

          # Changes on every build; larger than the upstream app's normal versionCode.
          # Keeps future APK updates in increasing order without changing package ID,
          # so release and main builds can be installed over each other in either direction.
          version_code = int(time.time() // 60)
          version_pattern = r'(?m)^(\s*versionCode\s*=\s*)\d+'
          if len(re.findall(version_pattern, source)) != 1:
              raise SystemExit('Upstream versionCode layout changed; stopping.')
          source = re.sub(version_pattern, lambda m: m.group(1) + str(version_code), source, count=1)

          # main builds: tag the versionName (e.g. 0.5.13-main.abc1234) so the
          # app's About screen shows which build is installed.
          suffix = os.environ.get('VERSION_SUFFIX', '')
          if suffix:
              name_pattern = r'(?m)^(\s*versionName\s*=\s*")([^"]+)(")'
              if len(re.findall(name_pattern, source)) != 1:
                  raise SystemExit('Upstream versionName layout changed; stopping.')
              source = re.sub(name_pattern, lambda m: m.group(1) + m.group(2) + suffix + m.group(3), source, count=1)

          path.write_text(source, encoding='utf-8')
          print(f'Patched Android 7.1 (API 25), java.time support, versionCode={version_code}, versionName suffix={suffix or "(none)"}.')
          PY

      - name: Set up Gradle cache
        if: steps.version.outputs.already_built == 'false'
        uses: gradle/actions/setup-gradle@v4

      # "perf" = upstream's release settings (R8 optimization, not debuggable)
      # signed with the debug key, so it installs over earlier debug builds
      # signed with the same key without losing app data.
      - name: Build Fire OS 6-compatible PlayPerf APK
        if: steps.version.outputs.already_built == 'false'
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assemblePlayPerf --no-daemon --stacktrace --console=plain 2>&1 | tee ../fireos6-build.log

      - name: Verify the APK and prepare distribution asset
        if: steps.version.outputs.already_built == 'false'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find upstream/app/build/outputs/apk/play/perf -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk" || { echo 'No APK was generated' >&2; exit 1; }
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" | tee fireos6-apk-info.txt
          "$aapt" dump badging "$apk" | grep -q "sdkVersion:'25'" || { echo 'APK minimum SDK is not 25' >&2; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -E '^Signer #1 certificate SHA-256 digest:'
          mkdir -p out
          cp "$apk" out/AerioTV-FireOS6.apk

      - name: Upload APK to the successful workflow run
        if: steps.version.outputs.already_built == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-FireOS6-${{ steps.version.outputs.local_tag }}
          path: |
            out/AerioTV-FireOS6.apk
            fireos6-apk-info.txt
          if-no-files-found: error

      - name: Publish a custom GitHub release
        if: steps.version.outputs.already_built == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          UPSTREAM_REF: ${{ steps.version.outputs.upstream_ref }}
          LOCAL_TAG: ${{ steps.version.outputs.local_tag }}
          LABEL: ${{ steps.version.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = main ]; then
            title="AerioTV $LABEL for Fire OS 6 (dev build from upstream main)"
            source_url="https://github.com/jonzey231/AerioTV-Android/tree/$UPSTREAM_REF"
            warning=" UNRELEASED: built from the upstream main branch, which may contain unfinished or reverted work."
          else
            title="AerioTV $LABEL for Fire OS 6 (experimental)"
            source_url="https://github.com/jonzey231/AerioTV-Android/tree/$UPSTREAM_REF"
            warning=""
          fi
          # Rebuild: replace the old release only now, after the new APK built and verified.
          if gh release view "$LOCAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing existing release $LOCAL_TAG"
            gh release delete "$LOCAL_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          # Fork releases point at this repo's default branch; the source of truth
          # is the upstream commit/tag linked in the notes.
          gh release create "$LOCAL_TAG" 'out/AerioTV-FireOS6.apk#AerioTV-FireOS6.apk' \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes "Source: $source_url.$warning Rebuilt for Android 7.1 / API 25, with Java time desugaring. Signed with the private key configured in this fork's Actions secrets. Also installs on newer Android TV devices (minSdk 25). Review and test on Fire OS 6 before installing. The app does not silently self-update." \
            --prerelease

      - name: Prune old main builds (keep the newest 5)
        if: steps.version.outputs.already_built == 'false' && steps.version.outputs.channel == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("fireos6-main-"))] | sort_by(.published_at) | reverse | .[5:] | .[].tag_name' |
          while read -r tag; do
            [[ "$tag" =~ ^fireos6-main-[0-9a-f]{7}$ ]] || continue
            echo "Deleting old dev build $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-FireOS6-Failed-Build-Log
          path: fireos6-build.log
          if-no-files-found: ignore
